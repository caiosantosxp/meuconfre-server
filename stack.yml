# ──────────────────────────────────────────────────────────────
# MeuCofre - servidor de sincronizacao (Docker Swarm + Portainer + Traefik)
#
# Portainer: Stacks -> Add stack -> Web editor -> cole -> preencha as
# Environment variables (lista no fim) -> Deploy.
#
# Imagem vem do ghcr.io (Swarm nao builda). Publique com o workflow
# .github/workflows/deploy.yml OU com os comandos do README.
# ──────────────────────────────────────────────────────────────
version: "3.8"

services:
  meucofre:
    image: ${IMAGE:-ghcr.io/caiosantosxp/meuconfre-server:latest}
    networks:
      - network_swarm_public
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}          # postgres://user:senha@host:5432/password
      PGSSL: ${PGSSL:-false}                 # true se o Postgres exigir SSL
      JWT_SECRET: ${JWT_SECRET}              # segredo forte e aleatorio
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}  # mude p/ false apos criar sua conta
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.meucofre.rule=Host(`${DOMAIN:-password.desbug.pro}`)
        - traefik.http.routers.meucofre.entrypoints=websecure
        - traefik.http.routers.meucofre.tls.certresolver=letsencryptresolver
        - traefik.http.services.meucofre.loadbalancer.server.port=3000
        - traefik.http.services.meucofre.loadbalancer.passHostHeader=true

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
  # Se o seu Postgres estiver em OUTRA rede overlay do swarm (nao acessivel
  # pela publica), adicione-a aqui e tambem em services.meucofre.networks:
  # postgres_network:
  #   name: postgres_network
  #   external: true
